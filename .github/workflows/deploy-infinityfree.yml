name: Deploy to InfinityFree

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infinityfree-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check required secrets
        env:
          FTP_SERVER: ${{ vars.FTP_SERVER || secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ vars.FTP_USERNAME || secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          DB_HOST: ${{ vars.DB_HOST || secrets.DB_HOST }}
          DB_NAME: ${{ vars.DB_NAME || secrets.DB_NAME }}
          DB_USER: ${{ vars.DB_USER || secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          ADMIN_SETUP_TOKEN: ${{ secrets.ADMIN_SETUP_TOKEN }}
        run: |
          for name in FTP_PASSWORD DB_PASS ADMIN_SETUP_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done
          for name in FTP_SERVER FTP_USERNAME DB_HOST DB_NAME DB_USER; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions variable or secret: $name"
              exit 1
            fi
          done

      - name: Generate private database settings
        env:
          DB_HOST: ${{ vars.DB_HOST || secrets.DB_HOST }}
          DB_NAME: ${{ vars.DB_NAME || secrets.DB_NAME }}
          DB_USER: ${{ vars.DB_USER || secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          ADMIN_SETUP_TOKEN: ${{ secrets.ADMIN_SETUP_TOKEN }}
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os

          settings = {
              "host": os.environ["DB_HOST"],
              "name": os.environ["DB_NAME"],
              "user": os.environ["DB_USER"],
              "pass": os.environ["DB_PASS"],
              "setup_token": os.environ["ADMIN_SETUP_TOKEN"],
          }
          encoded = base64.b64encode(json.dumps(settings).encode()).decode()
          with open("db-settings.php", "w", encoding="utf-8") as config:
              config.write("<?php\nreturn json_decode(base64_decode('" + encoded + "'), true);\n")
          PY

      - name: Deploy site files
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ vars.FTP_SERVER || secrets.FTP_SERVER }}
          username: ${{ vars.FTP_USERNAME || secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          server-dir: htdocs/
          local-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.github/**
            **/docs/**
            **/*.zip